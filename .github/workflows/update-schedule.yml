name: Update schedule

on:
  schedule:
    # 03:00 UTC = ~10:00 Novosibirsk.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  scrape:
    # Runs on YOUR own computer (a self-hosted runner), not GitHub's cloud
    # servers - the target site blocks GitHub's/Azure's datacenter IPs.
    runs-on: self-hosted
    timeout-minutes: 360

    env:
      SUPABASE_URL: "https://wsrrqwvemfliwzsqlkvg.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUCAPTCHA_KEY: ${{ secrets.RUCAPTCHA_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer and stealth plugin
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      # Opens the timetable of every teacher in teacher_roster on the
      # university site and writes down every group they teach.
      # Doesn't change the database. If it fails, the next step still
      # scrapes the fixed groups.
      - name: Find all groups of our teachers
        continue-on-error: true
        env:
          LECTURER_GROUPS_MODE: "1"
        run: node scripts/scrape-lecturers.js

      # Scrapes the fixed groups + every group found above, one by one.
      - name: Scrape groups
        env:
          TIMETABLE_GROUP_NAMES: "128,121,122,124"
        run: node scripts/scrape-groups.js

      - name: Upload debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: |
            debug-page.html
            debug-lecturer-page.html
            lecturer-groups.txt
          if-no-files-found: ignore
          retention-days: 7
