name: Update schedule

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: self-hosted

    env:
      SUPABASE_URL: "https://wsrrqwvemfliwzsqlkvg.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUCAPTCHA_KEY: ${{ secrets.RUCAPTCHA_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer and stealth plugin
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Group 128
        continue-on-error: true
        env:
          TIMETABLE_GROUP_NAME: "128"
        run: node scripts/scrape-schedule.js

      - name: Teachers' own timetables
        continue-on-error: true
        env:
          LECTURER_APP_MODE: "1"
          SKIP_GROUPS: "128"
        run: node scripts/scrape-lecturers.js

      - name: Upload debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: |
            debug-page.html
            debug-lecturer-page.html
          if-no-files-found: ignore
          retention-days: 7
