<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Домашка — Учителям</title>
<link rel="manifest" href="manifest-teacher.json">
<meta name="theme-color" content="#051F20">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#051F20;
  --bg-card:#0B2E2F;
  --bg-card-2:#0F3A3B;
  --accent:#4FD1A5;
  --accent-dark:#2FAE84;
  --text-primary:#F2FBF8;
  --text-secondary:#9FC7BE;
  --border:rgba(255,255,255,.08);
  --danger:#E8605C;
  --success:#4FD1A5;
  --warn:#E0B13C;
  --radius:16px;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:
    radial-gradient(ellipse at top, rgba(79,209,165,.08), transparent 55%),
    linear-gradient(180deg, #051F20 0%, #031617 100%);
  color:var(--text-primary);
  min-height:100vh;
  padding-bottom:40px;
}
h1,h2,h3,.brand{font-family:'Unbounded',sans-serif}

.loading{color:var(--text-secondary);font-size:.9rem;text-align:center;padding:40px 16px}

/* ---------- App header ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 16px 8px;max-width:520px;margin:0 auto;
}
.chip{
  display:flex;align-items:center;gap:8px;background:var(--bg-card);
  border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:600;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.logout{color:var(--text-secondary);font-size:.8rem;background:none;border:none;cursor:pointer;text-decoration:underline}

/* ---------- Day nav ---------- */
.daynav{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:14px 0 18px;
}
.nav-btn{
  width:42px;height:42px;border-radius:12px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text-primary);font-size:1.2rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.nav-btn:active{background:var(--bg-card-2)}
.day-label{text-align:center;flex:1}
.day-label .dv-day{font-family:'Unbounded',sans-serif;font-weight:700;font-size:1.05rem}
.day-label .dv-date{color:var(--text-secondary);font-size:.78rem;margin-top:2px}

/* ---------- Lesson cards ---------- */
.lesson-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
}
.lesson-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lesson-time{color:var(--accent);font-weight:700;font-size:.82rem;font-family:'Unbounded',sans-serif}
.lesson-subject{font-weight:800;font-size:1.1rem;margin-top:4px;line-height:1.25}
.lesson-meta{color:var(--text-secondary);font-size:.85rem;margin-top:6px}
.hw-status{
  display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;
  padding:5px 10px;border-radius:999px;margin-top:10px;
}
.hw-status.done{background:rgba(79,209,165,.12);color:var(--success)}
.hw-status.pending{background:rgba(224,177,60,.12);color:var(--warn)}
.hw-btn{
  margin-top:12px;width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--accent);
  background:transparent;color:var(--accent);font-weight:700;font-size:.9rem;cursor:pointer;
  font-family:'Unbounded',sans-serif;
}
.hw-btn:active{background:rgba(79,209,165,.1)}
.empty-day{
  text-align:center;color:var(--text-secondary);padding:50px 20px;font-size:.92rem;line-height:1.5;
}

/* ---------- Modal ---------- */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  align-items:flex-end;justify-content:center;z-index:50;
}
.overlay.active{display:flex}
.modal{
  width:100%;max-width:520px;background:var(--bg-card);border-radius:20px 20px 0 0;
  padding:22px 18px 28px;max-height:85vh;overflow-y:auto;
}
.modal h3{font-size:1.05rem;margin-bottom:4px}
.modal .modal-sub{color:var(--text-secondary);font-size:.82rem;margin-bottom:16px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--text-secondary);margin:14px 0 6px}
input,textarea{
  width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:10px;
  font-size:.95rem;background:rgba(255,255,255,.03);color:var(--text-primary);
  font-family:inherit;
}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--accent)}
.btn{
  padding:14px;border:none;border-radius:12px;
  background:var(--accent);color:#052421;font-size:1rem;font-weight:700;cursor:pointer;
  font-family:'Unbounded',sans-serif;
}
.btn:disabled{opacity:.55}
.btn:active{background:var(--accent-dark)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text-primary)}
.modal-actions{display:flex;gap:10px;margin-top:18px}

/* ---------- View tabs ---------- */
.tabs{display:flex;gap:8px;max-width:520px;margin:6px auto 0;padding:0 16px}
.tab{
  flex:1;padding:10px;border-radius:999px;border:1.5px solid var(--border);background:var(--bg-card);
  color:var(--text-secondary);font-weight:700;font-size:.85rem;cursor:pointer;font-family:'Unbounded',sans-serif;
}
.tab.on{background:var(--accent);border-color:var(--accent);color:#052421}

/* ---------- Two-week table (same layout as the students' table) ---------- */
#weeksView{max-width:1100px;margin:16px auto 0;padding:0 16px}
.week-title{font-family:'Unbounded',sans-serif;font-weight:700;font-size:1rem;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.week-title:first-child{margin-top:0}
.week-title .now{font-family:'Golos Text',sans-serif;font-size:.72rem;font-weight:700;color:#052421;background:#E08A3C;border-radius:999px;padding:3px 9px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:14px;background:var(--bg-card);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:760px;table-layout:fixed}
th{background:var(--bg-card-2);color:var(--accent);font-size:.72rem;font-weight:600;padding:10px 2px;text-align:center;white-space:nowrap;border-right:1px solid var(--border)}
th.left{min-width:64px;width:64px}
td{border:1px solid var(--border);vertical-align:top;padding:0}
td.day{background:var(--bg-card-2);text-align:center;padding:8px 2px;font-weight:700;font-size:.85rem;min-width:64px;width:64px}
td.day .d-date{display:block;font-weight:400;font-size:.68rem;color:var(--text-secondary);margin-top:2px}
td.slot{height:84px;min-width:96px;padding:5px;cursor:default}
td.slot.has{background:rgba(79,209,165,.07);cursor:pointer}
td.slot.has:hover{background:rgba(79,209,165,.13)}
td.slot .s-grp{font-weight:700;font-size:.78rem;line-height:1.25}
td.slot .s-subj{font-size:.7rem;color:var(--text-secondary);margin-top:2px;line-height:1.2}
td.slot .s-room{font-size:.68rem;color:var(--text-secondary);margin-top:2px}
td.slot .tag-dz{display:inline-block;font-size:.6rem;font-weight:800;background:var(--success);color:#052421;border-radius:4px;padding:1px 4px;margin-bottom:3px}
td.slot .part + .part{border-top:1px dashed var(--border);margin-top:4px;padding-top:4px}
th.current-slot{background:#E08A3C;color:#052421}
td.day.current-day{background:rgba(224,138,60,.16);border-left:3px solid #E08A3C}
td.slot.current-day{background:rgba(224,138,60,.08)}
td.slot.current-slot{box-shadow:inset 0 0 0 2px #E08A3C}

/* ---------- Attachments ---------- */
.attach-btns{display:flex;gap:8px}
.attach-btn{flex:1;padding:11px 8px;font-size:.8rem}
.attach-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.attach-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:6px 8px}
.attach-item img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0}
.attach-item .ic{width:44px;height:44px;border-radius:8px;background:var(--bg-card-2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.attach-item .nm{flex:1;font-size:.82rem;word-break:break-all;line-height:1.3}
.attach-item .nm small{display:block;color:var(--text-secondary);font-size:.7rem}
.attach-item .rm{background:none;border:none;color:var(--danger);font-size:1.3rem;cursor:pointer;padding:0 6px}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--bg-card-2);color:var(--text-primary);padding:12px 18px;border-radius:12px;
  font-size:.85rem;box-shadow:var(--shadow);z-index:100;opacity:0;transition:opacity .2s;
  border:1px solid var(--border);max-width:90vw;text-align:center;
}
.toast.show{opacity:1}
</style>
</head>

<!-- ===================== HOMEWORK MODAL ===================== -->

<script>
window.addEventListener("error", function(e){
  showToast("Ошибка: " + (e.message || "неизвестная ошибка"));
});

var SUPABASE_URL = "https://wsrrqwvemfliwzsqlkvg.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzcnJxd3ZlbWZsaXd6c3Fsa3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMDc1NDYsImV4cCI6MjEwNDc4MzU0Nn0.mcnzJ6Fh5eTCJSYXQ6rMkBHAbL5JPIC1UId1DlRfuDY";
if(typeof supabase === "undefined"){
  document.getElementById("bootMsg").textContent = "Не удалось загрузить библиотеку Supabase. Проверь интернет и обнови страницу (Ctrl+F5).";
  throw new Error("supabase js failed to load");
}
// Teacher login is stored under its OWN key, so being signed in as a
// teacher never replaces a student's login in the same browser (and the
// other way round) - both pages can be open at once.
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: "domashka-teacher-auth", persistSession: true, autoRefreshToken: true }
});

var DAY_NAMES = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
var MONTH_NAMES = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
var DAY_SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
var TIMES = ["08:30–10:00","10:15–11:45","12:00–13:30","14:10–15:35","15:45–17:10","17:20–18:45","18:50–20:15","20:20–21:50"];
var currentView = "day";

var teacherProfile = null;   // { id, full_name }
var lessonsCache = [];       // all schedule_slots joined with homework, for this teacher
var dayViewAbsIndex = 0;     // 0..13 across the 2-week span (week*7+day)
var activeLessons = [];      // the merged card being edited (one row per group)

function showToast(text){
  var t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 2400);
}
function goToLogin(){
  window.location.href = "teacher.html";
}

/* ---------------- Boot: this page REQUIRES a logged-in teacher ---------------- */

async function loadTeacherProfile(){
  var sess = await sb.auth.getSession();
  if(!sess.data.session){ goToLogin(); return; }

  var res = await sb.from("teacher_profiles").select("id,full_name").eq("id", sess.data.session.user.id).maybeSingle();
  if(res.error || !res.data){ goToLogin(); return; }

  teacherProfile = res.data;
  document.getElementById("nameChip").textContent = teacherProfile.full_name;
  document.getElementById("bootMsg").style.display = "none";
  document.getElementById("app").style.display = "block";

  await loadLessons();
  dayViewAbsIndex = todayAbsIndex();   // after loading, so real lesson dates can be matched
  try{ if(localStorage.getItem("domashka_teacher_view") === "weeks") currentView = "weeks"; }catch(e){}
  setView(currentView);
}

document.getElementById("logoutBtn").onclick = async function(){
  await sb.auth.signOut();
  localStorage.removeItem("domashka_teacher_name");
  teacherProfile = null;
  goToLogin();
};

/* ---------------- Day math ---------------- */

function weekAndDayFromAbs(abs){
  var week = abs < 7 ? 1 : 2;
  var day = abs % 7; // 0..6 = Mon..Sun
  return { week: week, day: day };
}

function todayAbsIndex(){
  // Try to match a real lesson_date from the loaded cache first.
  var now = new Date();
  var todayStr = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0");
  for(var w = 1; w <= 2; w++){
    for(var dd = 0; dd < 7; dd++){
      var dt = dateFor(w, dd);
      if(dt && isoLocal(dt) === todayStr) return weekDayToAbs(w, dd);
    }
  }
  // Fallback: plain weekday math.
  var jsDay = new Date().getDay(); // 0=Sun..6=Sat
  var dayIndex = (jsDay + 6) % 7;  // Mon=0..Sun=6
  return weekDayToAbs(1, dayIndex);
}
function weekDayToAbs(week, day){
  return (week === 2 ? 7 : 0) + day;
}

function isoLocal(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
// Real calendar date of (week, day), counted from any lesson of that same
// week that has a date (the site's two weeks can be in either order, so we
// never guess across weeks).
function dateFor(week, day){
  for(var i = 0; i < lessonsCache.length; i++){
    var l = lessonsCache[i];
    if(l.week_number === week && l.lesson_date){
      var d = new Date(l.lesson_date + "T00:00:00");
      d.setDate(d.getDate() - l.day_index + day);
      return d;
    }
  }
  return null;
}
function shortDate(d){ return d ? d.getDate() + " " + MONTH_NAMES[d.getMonth()] : ""; }

function renderDayLabel(){
  var wd = weekAndDayFromAbs(dayViewAbsIndex);
  document.getElementById("dvDay").textContent =
    DAY_NAMES[wd.day] + " · " + wd.week + " нед.";

  document.getElementById("dvDate").textContent = shortDate(dateFor(wd.week, wd.day));
}

document.getElementById("dvPrev").onclick = function(){
  dayViewAbsIndex = (dayViewAbsIndex + 13) % 14;
  renderDay();
};
document.getElementById("dvNext").onclick = function(){
  dayViewAbsIndex = (dayViewAbsIndex + 1) % 14;
  renderDay();
};

/* ---------------- Lessons ---------------- */

async function loadLessons(){
  // RLS (is_slot_mine) restricts this to the signed-in teacher's own lessons
  // across every group they teach, so no explicit teacher filter is needed.
  var res = await sb
    .from("schedule_slots")
    .select("id,group_id,week_number,day_index,slot_index,lesson_date,subject,room,groups_label,groups(name),homework(id,description,due_date,attachments)")
    .order("week_number").order("day_index").order("slot_index");

  if(res.error){
    showToast("Не получилось загрузить расписание: " + res.error.message);
    lessonsCache = [];
    return;
  }
  lessonsCache = res.data || [];
}

// A lecture shared by several groups ("121, 122, 124, 128 гр.") is stored
// once per group, so the same lesson comes back several times. Show it as
// ONE card; saving homework writes it to every group's copy.
function mergeLessons(list){
  var byKey = {};
  var out = [];
  list.forEach(function(l){
    var key = [l.week_number, l.day_index, l.slot_index, l.subject || "", l.room || "", l.groups_label || ""].join("|");
    if(!byKey[key]){
      byKey[key] = { slot_index: l.slot_index, subject: l.subject, room: l.room, rows: [], groupNames: [] };
      out.push(byKey[key]);
    }
    byKey[key].rows.push(l);
    var gn = l.groups && l.groups.name;
    if(gn && byKey[key].groupNames.indexOf(gn) === -1) byKey[key].groupNames.push(gn);
  });
  out.forEach(function(c){
    var first = c.rows[0];
    c.groupLabel = first.groups_label || (c.groupNames.length ? c.groupNames.join(", ") + " гр." : "Группа");
    // Homework from whichever copy already has it.
    c.hw = null;
    c.rows.forEach(function(r){
      var h = Array.isArray(r.homework) ? r.homework[0] : r.homework;
      var hasText = h && h.description && h.description.trim();
      var hasFiles = h && Array.isArray(h.attachments) && h.attachments.length;
      if(!c.hw && (hasText || hasFiles)) c.hw = h;
    });
  });
  return out;
}

function renderDay(){
  renderDayLabel();
  var wd = weekAndDayFromAbs(dayViewAbsIndex);
  var list = mergeLessons(lessonsCache.filter(function(l){
    return l.week_number === wd.week && l.day_index === wd.day;
  })).sort(function(a,b){ return a.slot_index - b.slot_index; });

  var wrap = document.getElementById("dvList");
  wrap.innerHTML = "";

  if(!list.length){
    wrap.innerHTML = '<div class="empty-day">В этот день занятий нет.</div>';
    return;
  }

  list.forEach(function(c){
    var card = document.createElement("div");
    card.className = "lesson-card";
    var hasHw = !!c.hw;
    var timeLabel = "Пара " + (c.slot_index + 1);

    card.innerHTML =
      '<div class="lesson-top">' +
        '<div>' +
          '<div class="lesson-time">' + timeLabel + '</div>' +
          '<div class="lesson-subject">' + escapeHtml(c.subject || "Предмет") + '</div>' +
          '<div class="lesson-meta">' + escapeHtml(c.groupLabel) + (c.room ? ' · ' + escapeHtml(c.room) : '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="hw-status ' + (hasHw ? "done" : "pending") + '">' +
        (hasHw ? "✓ Задание добавлено" : "Задание ещё не добавлено") +
      '</div>' +
      '<button class="hw-btn">' + (hasHw ? "Изменить задание" : "Добавить задание") + '</button>';

    card.querySelector(".hw-btn").onclick = function(){ openHwModal(c); };
    wrap.appendChild(card);
  });
}

/* ---------------- View switch: one day / two-week table ---------------- */

function setView(v){
  currentView = v;
  try{ localStorage.setItem("domashka_teacher_view", v); }catch(e){}
  document.getElementById("tabDay").classList.toggle("on", v === "day");
  document.getElementById("tabWeeks").classList.toggle("on", v === "weeks");
  document.getElementById("dayView").style.display = v === "day" ? "block" : "none";
  document.getElementById("weeksView").style.display = v === "weeks" ? "block" : "none";
  renderAll();
}
document.getElementById("tabDay").onclick = function(){ setView("day"); };
document.getElementById("tabWeeks").onclick = function(){ setView("weeks"); };

function renderAll(){
  if(currentView === "weeks") renderWeeks(); else renderDay();
}

// Index of the lesson slot happening right now (or -1).
function currentSlotIndex(){
  var now = new Date();
  var mins = now.getHours() * 60 + now.getMinutes();
  for(var i = 0; i < TIMES.length; i++){
    var m = TIMES[i].match(/(\d+):(\d+)\D+(\d+):(\d+)/);
    var from = +m[1] * 60 + +m[2], to = +m[3] * 60 + +m[4];
    if(mins >= from && mins <= to) return i;
  }
  return -1;
}

function renderWeeks(){
  var todayAbs = todayAbsIndex();
  var todayWD = weekAndDayFromAbs(todayAbs);
  var todayIsReal = false;
  var nowStr = isoLocal(new Date());
  var tdt = dateFor(todayWD.week, todayWD.day);
  if(tdt && isoLocal(tdt) === nowStr) todayIsReal = true;
  var curSlot = todayIsReal ? currentSlotIndex() : -1;

  var html = "";
  for(var w = 1; w <= 2; w++){
    var isCurWeek = todayIsReal && todayWD.week === w;
    var mon = dateFor(w, 0), sat = dateFor(w, 5);
    html += '<div class="week-title">' + w + ' неделя' +
      (mon && sat ? ' <span style="font-family:Golos Text,sans-serif;font-weight:500;font-size:.8rem;color:var(--text-secondary)">' + shortDate(mon) + ' – ' + shortDate(sat) + '</span>' : '') +
      (isCurWeek ? ' <span class="now">сейчас</span>' : '') + '</div>';
    html += '<div class="scroll"><table><thead><tr><th class="left">День</th>';
    for(var t = 0; t < TIMES.length; t++){
      html += '<th class="' + (isCurWeek && t === curSlot ? 'current-slot' : '') + '">' + TIMES[t] + '</th>';
    }
    html += '</tr></thead><tbody>';

    for(var d = 0; d < 7; d++){
      var isToday = isCurWeek && todayWD.day === d;
      var dt = dateFor(w, d);
      html += '<tr><td class="day' + (isToday ? ' current-day' : '') + '">' + DAY_SHORT[d] +
        (dt ? '<span class="d-date">' + dt.getDate() + '.' + String(dt.getMonth()+1).padStart(2,"0") + '</span>' : '') + '</td>';

      var dayCards = mergeLessons(lessonsCache.filter(function(l){ return l.week_number === w && l.day_index === d; }));
      for(var t2 = 0; t2 < TIMES.length; t2++){
        var cards = dayCards.filter(function(c){ return c.slot_index === t2; });
        var cls = "slot" + (cards.length ? " has" : "") + (isToday ? " current-day" : "") + (isToday && t2 === curSlot ? " current-slot" : "");
        html += '<td class="' + cls + '" data-w="' + w + '" data-d="' + d + '" data-t="' + t2 + '">';
        cards.forEach(function(c, ci){
          html += '<div class="part" data-ci="' + ci + '">' +
            (c.hw ? '<span class="tag-dz">ДЗ</span>' : '') +
            '<div class="s-grp">' + escapeHtml(c.groupLabel) + '</div>' +
            '<div class="s-subj">' + escapeHtml(c.subject || "") + '</div>' +
            (c.room ? '<div class="s-room">' + escapeHtml(c.room) + '</div>' : '') +
          '</div>';
        });
        html += '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div>';
  }
  if(!lessonsCache.length){
    html = '<div class="empty-day">Расписание пока не загружено.</div>';
  }

  var wrap = document.getElementById("weeksView");
  wrap.innerHTML = html;

  // Click a lesson -> same homework window as in the day view.
  Array.prototype.forEach.call(wrap.querySelectorAll("td.slot.has .part"), function(el){
    el.onclick = function(){
      var td = el.closest("td");
      var w = +td.getAttribute("data-w"), d = +td.getAttribute("data-d"), t = +td.getAttribute("data-t");
      var cards = mergeLessons(lessonsCache.filter(function(l){ return l.week_number === w && l.day_index === d; }))
        .filter(function(c){ return c.slot_index === t; });
      var c = cards[+el.getAttribute("data-ci")];
      if(c) openHwModal(c);
    };
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
  });
}

/* ---------------- Homework modal ---------------- */

// Files in the open homework window: already-saved ones ({name,url,type,size})
// and newly picked ones ({file, preview}) that upload on "Сохранить".
var HW_BUCKET = "homework-files";
var MAX_FILE_MB = 20;
var attachSaved = [];
var attachNew = [];

function fmtSize(b){
  if(!b && b !== 0) return "";
  return b < 1024*1024 ? Math.max(1, Math.round(b/1024)) + " КБ" : (b/1024/1024).toFixed(1) + " МБ";
}
function renderAttachList(){
  var wrap = document.getElementById("attachList");
  wrap.innerHTML = "";
  function row(thumb, name, size, onRemove, link){
    var el = document.createElement("div");
    el.className = "attach-item";
    el.innerHTML = thumb + '<div class="nm">' + escapeHtml(name) + '<small>' + escapeHtml(size) + '</small></div><button class="rm" title="Убрать">×</button>';
    el.querySelector(".rm").onclick = onRemove;
    if(link){ el.querySelector(".nm").style.cursor = "pointer"; el.querySelector(".nm").onclick = function(){ window.open(link, "_blank"); }; }
    wrap.appendChild(el);
  }
  attachSaved.forEach(function(f, i){
    var isImg = /^image\//.test(f.type || "");
    row(isImg ? '<img src="' + escapeHtml(f.url) + '">' : '<div class="ic">📄</div>', f.name || "файл", fmtSize(f.size),
      function(){ attachSaved.splice(i, 1); renderAttachList(); }, f.url);
  });
  attachNew.forEach(function(n, i){
    var isImg = /^image\//.test(n.file.type || "");
    row(isImg ? '<img src="' + n.preview + '">' : '<div class="ic">📄</div>', n.file.name, fmtSize(n.file.size) + " · ещё не сохранено",
      function(){ if(n.preview) URL.revokeObjectURL(n.preview); attachNew.splice(i, 1); renderAttachList(); });
  });
}
function addPickedFiles(list){
  Array.prototype.forEach.call(list || [], function(f){
    if(f.size > MAX_FILE_MB * 1024 * 1024){ showToast("«" + f.name + "» больше " + MAX_FILE_MB + " МБ — не добавлен"); return; }
    attachNew.push({ file: f, preview: /^image\//.test(f.type) ? URL.createObjectURL(f) : "" });
  });
  renderAttachList();
}
document.getElementById("addPhotoBtn").onclick = function(){ document.getElementById("photoInput").click(); };
document.getElementById("addFileBtn").onclick = function(){ document.getElementById("fileInput").click(); };
document.getElementById("photoInput").onchange = function(){ addPickedFiles(this.files); this.value = ""; };
document.getElementById("fileInput").onchange = function(){ addPickedFiles(this.files); this.value = ""; };

// Storage keys must be plain ASCII, so the file gets a random key and keeps
// its real (e.g. Russian) name only in the homework record.
async function uploadOne(f){
  var ext = (f.name.match(/\.([A-Za-z0-9]{1,8})$/) || [])[1] || "";
  var key = teacherProfile.id + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 10) + (ext ? "." + ext.toLowerCase() : "");
  var up = await sb.storage.from(HW_BUCKET).upload(key, f, { contentType: f.type || "application/octet-stream", upsert: false });
  if(up.error) throw new Error("«" + f.name + "»: " + up.error.message);
  var pub = sb.storage.from(HW_BUCKET).getPublicUrl(key);
  return { name: f.name, url: pub.data.publicUrl, type: f.type || "", size: f.size, path: key };
}

function openHwModal(c){
  activeLessons = c.rows;
  document.getElementById("hwModalTitle").textContent = c.subject || "Домашнее задание";
  document.getElementById("hwModalSub").textContent = c.groupLabel + (c.room ? " · " + c.room : "");
  document.getElementById("hwDesc").value = c.hw && c.hw.description ? c.hw.description : "";
  document.getElementById("hwDue").value = c.hw && c.hw.due_date ? c.hw.due_date : "";
  attachSaved = (c.hw && Array.isArray(c.hw.attachments)) ? c.hw.attachments.slice() : [];
  attachNew.forEach(function(n){ if(n.preview) URL.revokeObjectURL(n.preview); });
  attachNew = [];
  renderAttachList();
  document.getElementById("hwOverlay").classList.add("active");
}
document.getElementById("hwCancelBtn").onclick = function(){
  document.getElementById("hwOverlay").classList.remove("active");
};

document.getElementById("hwSaveBtn").onclick = async function(){
  if(!activeLessons.length) return;
  var btn = document.getElementById("hwSaveBtn");
  btn.disabled = true; btn.textContent = "Сохраняем...";

  var desc = document.getElementById("hwDesc").value.trim();
  var due = document.getElementById("hwDue").value || null;

  try{
    var uploaded = [];
    for(var ui = 0; ui < attachNew.length; ui++){
      btn.textContent = "Загружаем " + (ui + 1) + " из " + attachNew.length + "...";
      uploaded.push(await uploadOne(attachNew[ui].file));
    }
    var attachments = attachSaved.concat(uploaded);
    btn.textContent = "Сохраняем...";

    // One homework row per group's copy of the lesson (unique per slot),
    // so every group sees the same assignment.
    var rows = activeLessons.map(function(l){
      return { schedule_slot_id: l.id, description: desc, due_date: due, attachments: attachments };
    });
    var res = await sb.from("homework").upsert(rows, { onConflict: "schedule_slot_id" });

    if(res.error){
      showToast("Не сохранилось: " + res.error.message);
      return;
    }

    attachNew.forEach(function(n){ if(n.preview) URL.revokeObjectURL(n.preview); });
    attachNew = [];
    document.getElementById("hwOverlay").classList.remove("active");
    showToast(rows.length > 1 ? "Задание сохранено для " + rows.length + " групп" : "Задание сохранено");
    await loadLessons();
    renderAll();
  } catch(e){
    showToast("Ошибка: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "Сохранить";
  }
};

loadTeacherProfile();
</script>
