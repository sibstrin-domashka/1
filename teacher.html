<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Домашка — Учителям</title>
<link rel="manifest" href="manifest-teacher.json">
<meta name="theme-color" content="#051F20">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#051F20;
  --bg-card:#0B2E2F;
  --accent:#4FD1A5;
  --accent-dark:#2FAE84;
  --text-primary:#F2FBF8;
  --text-secondary:#9FC7BE;
  --border:rgba(255,255,255,.08);
  --danger:#E8605C;
  --success:#4FD1A5;
  --radius:16px;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:
    radial-gradient(ellipse at top, rgba(79,209,165,.08), transparent 55%),
    linear-gradient(180deg, #051F20 0%, #031617 100%);
  color:var(--text-primary);
  min-height:100vh;
}
.brand{font-family:'Unbounded',sans-serif}

/* This page shows ONLY the login form - there is no second "screen" to
   toggle here. The dashboard lives entirely in teacher-app.html, exactly
   like auth.html (login) and index_3_updated.html (the app) are separate
   files for students. That split is what makes "hide the login screen"
   foolproof: there's no sibling screen left in the DOM that a CSS rule
   could accidentally leave visible underneath it. */
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px}
.auth-card{
  width:100%;max-width:400px;background:var(--bg-card);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:28px 22px;box-shadow:var(--shadow);backdrop-filter:blur(10px);
}
.brand{font-size:1.3rem;font-weight:800;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.auth-sub{color:var(--text-secondary);font-size:.88rem;margin-bottom:22px;line-height:1.4}
label{display:block;font-size:.8rem;font-weight:600;color:var(--text-secondary);margin:14px 0 6px}
input{
  width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:10px;
  font-size:1rem;background:rgba(255,255,255,.03);color:var(--text-primary);
  font-family:inherit;
}
input::placeholder{color:rgba(159,199,190,.5)}
input:focus{outline:none;border-color:var(--accent)}
.btn{
  width:100%;margin-top:22px;padding:14px;border:none;border-radius:12px;
  background:var(--accent);color:#052421;font-size:1rem;font-weight:700;cursor:pointer;
  font-family:'Unbounded',sans-serif;
}
.btn:disabled{opacity:.55}
.btn:active{background:var(--accent-dark)}
.msg{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:.85rem;display:none;line-height:1.4}
.msg.err{background:rgba(232,96,92,.12);color:var(--danger);display:block}
.msg.ok{background:rgba(79,209,165,.12);color:var(--success);display:block}
.loading{color:var(--text-secondary);font-size:.9rem;text-align:center}
</style>
</head>
<body>

<div id="bootMsg" class="loading">Загрузка...</div>

<div class="auth-card" id="authCard" style="display:none">
  <div class="brand">👨‍🏫 Домашка</div>
  <div class="auth-sub">Вход для преподавателей. Введите ФИО и код доступа, который вам прислали на рабочую почту.</div>

  <label>Фамилия Имя Отчество</label>
  <input type="text" id="authName" placeholder="Иванов Иван Иванович">

  <label>Код доступа</label>
  <input type="text" id="authCode" placeholder="Например: A1B2C3" autocapitalize="characters">

  <button class="btn" id="authBtn">Войти</button>
  <div class="msg" id="authMsg"></div>
</div>

<script>
// Показываем любую неожиданную ошибку прямо на экране входа, а не молча.
window.addEventListener("error", function(e){
  showBoot(false);
  var m = document.getElementById("authMsg");
  if(m){
    m.textContent = "Ошибка загрузки страницы: " + (e.message || "неизвестная ошибка") + ". Обнови страницу (Ctrl+F5).";
    m.className = "msg err";
  }
});

function showBoot(loading){
  document.getElementById("bootMsg").style.display = loading ? "block" : "none";
  document.getElementById("authCard").style.display = loading ? "none" : "block";
}

var SUPABASE_URL = "https://wsrrqwvemfliwzsqlkvg.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzcnJxd3ZlbWZsaXd6c3Fsa3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMDc1NDYsImV4cCI6MjEwNDc4MzU0Nn0.mcnzJ6Fh5eTCJSYXQ6rMkBHAbL5JPIC1UId1DlRfuDY";
if(typeof supabase === "undefined"){
  window.addEventListener("DOMContentLoaded", function(){
    showBoot(false);
    var m = document.getElementById("authMsg");
    if(m){ m.textContent = "Не удалось загрузить библиотеку Supabase. Проверь интернет и обнови страницу (Ctrl+F5)."; m.className = "msg err"; }
  });
  throw new Error("supabase js failed to load");
}
// Teacher login is stored under its OWN key, so being signed in as a
// teacher never replaces a student's login in the same browser (and the
// other way round) - both pages can be open at once.
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: "domashka-teacher-auth", persistSession: true, autoRefreshToken: true }
});

function showAuthMsg(text, ok){
  var m = document.getElementById("authMsg");
  m.textContent = text;
  m.className = "msg " + (ok ? "ok" : "err");
}
function clearAuthMsg(){
  var m = document.getElementById("authMsg");
  m.className = "msg"; m.textContent = "";
}
function goToApp(){
  window.location.href = "teacher-app.html";
}

/* ---------------- Auth ---------------- */

document.getElementById("authBtn").onclick = async function(){
  clearAuthMsg();
  var name = document.getElementById("authName").value.trim();
  var code = document.getElementById("authCode").value.trim().toUpperCase();
  if(!name || name.split(/\s+/).length < 2){ showAuthMsg("Введите полное ФИО"); return; }
  if(!code){ showAuthMsg("Введите код доступа"); return; }

  var btn = document.getElementById("authBtn");
  btn.disabled = true; btn.textContent = "Проверяем...";

  try{
    var emailRes = await sb.rpc("teacher_login_email", { p_full_name: name, p_code: code });
    if(emailRes.error){
      showAuthMsg("Не нашли такое имя с этим кодом доступа. Проверьте ФИО и код, или обратитесь к администратору.");
      return;
    }
    var email = emailRes.data;

    var signIn = await sb.auth.signInWithPassword({ email: email, password: code });
    if(signIn.error){
      var signUp = await sb.auth.signUp({ email: email, password: code });
      if(signUp.error){ showAuthMsg("Не получилось начать сессию: " + signUp.error.message); return; }
    }

    var rpc = await sb.rpc("join_teacher_by_roster", { p_full_name: name, p_code: code });
    if(rpc.error){
      if(rpc.error.message.indexOf("invalid_code") !== -1 || rpc.error.message.indexOf("not_in_roster") !== -1){
        showAuthMsg("Не нашли такое имя с этим кодом доступа. Проверьте ФИО и код, или обратитесь к администратору.");
      } else {
        showAuthMsg("Ошибка: " + rpc.error.message);
      }
      return;
    }

    localStorage.setItem("domashka_teacher_name", name);
    goToApp();
  } catch(e){
    showAuthMsg("Что-то пошло не так: " + e.message);
    btn.disabled = false; btn.textContent = "Войти";
  }
};

/* ---------------- Boot: already logged in? skip straight to the app ---------------- */

(async function(){
  try{
    var sess = await sb.auth.getSession();
    if(sess.data.session){
      var prof = await sb.from("teacher_profiles").select("id").eq("id", sess.data.session.user.id).maybeSingle();
      if(prof.data){
        goToApp();
        return;
      }
    }
  } catch(e){
    // Ignore - just fall through to showing the login form.
  }
  showBoot(false);
})();
</script>
</body>
</html>
