<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Домашка</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#051F20">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Домашка">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root {
  /* Домашка design system — client theme (см. артефакт "Домашка — Design System") */
  --bg:#051F20; --bg-elevated:#0B2B26;
  --surface:rgba(11,43,38,.72); --surface-solid:#0B2B26;
  --border:rgba(35,83,71,.6);
  --text-primary:#DAF1DE; --text-secondary:#8EB69B;
  --accent:#8EB69B; --accent-hover:#79A88A; --accent-contrast:#051F20;
  --accent-soft:rgba(142,182,155,.16);
  --success:#9FD8B3; --warn:#E3C077; --danger:#D98789;
  --owner-accent:#26784B;
  --scrim-top:rgba(5,31,32,.9); --scrim-bottom:rgba(5,31,32,.95);
  --today:#E3C077; --today-dark:#C9922B;
  --shadow:0 10px 28px rgba(0,0,0,.35);
  --radius-sm:8px; --radius-md:16px; --radius-lg:26px; --radius-pill:999px;
  --font-display:"Unbounded", system-ui, sans-serif;
  --font-body:"Golos Text", system-ui, sans-serif;

  /* старые имена оставлены как алиасы — их используют почти все правила ниже,
     переопределять сотни строк не пришлось: один раз задать здесь. */
  --blue:var(--accent); --blue-dark:var(--accent-hover); --blue-light:var(--accent-soft);
  --brown:var(--owner-accent); --brown-dark:#1D5C39;
  --cream:var(--bg-elevated); --white:var(--surface-solid); --black:var(--text-primary); --gray:var(--text-secondary);
}
body.theme-owner .owner-bar{background:linear-gradient(90deg,var(--owner-accent),#1D5C39)}
</style>
<style>
body.theme-admin th,body.theme-owner th{background:var(--blue)}
body.theme-admin th.left,body.theme-owner th.left{background:var(--brown-dark)}
body.theme-admin .mod-h,body.theme-owner .mod-h{background:var(--blue-dark)}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-body);
  color:var(--text-primary);min-height:100vh;line-height:1.4;
  background-color:var(--bg);
  background-image:
    linear-gradient(to bottom, var(--scrim-top) 0%, rgba(5,31,32,.55) 32%, rgba(5,31,32,.55) 68%, var(--scrim-bottom) 100%),
    url("assets/mountain-bg.jpg");
  background-repeat: no-repeat, no-repeat;
  background-position: center top, center 30%;
  background-size: 100% 100%, cover;
  background-attachment: fixed, fixed;
}
header{
  background:rgba(5,31,32,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);padding:11px 14px;
  position:sticky;top:0;z-index:50;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:var(--shadow);
}
.logo{font-size:1.2rem;font-weight:700;font-family:var(--font-display);color:var(--text-primary);display:flex;align-items:center;gap:7px}
.logo span{background:var(--accent);color:var(--accent-contrast);font-size:.68rem;padding:2px 8px;border-radius:20px}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.user-chip{
  display:flex;align-items:center;gap:7px;
  background:var(--accent-soft);border:1px solid rgba(142,182,155,.3);
  padding:4px 10px 4px 5px;border-radius:24px;font-size:.88rem;font-weight:500;
}
.avatar{
  width:28px;height:28px;border-radius:50%;background:var(--brown);
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;color:#fff;font-weight:700;overflow:hidden;flex-shrink:0;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.edit-btn{background:none;border:none;color:var(--blue);font-size:.75rem;font-weight:600;cursor:pointer}
button{cursor:pointer;border:none;border-radius:8px;font-size:.84rem;font-weight:600;padding:7px 13px;font-family:inherit}
.btn-blue{background:var(--accent);color:var(--accent-contrast);font-weight:600}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger);color:var(--accent-contrast)}
.btn-sm{padding:5px 10px;font-size:.78rem}
.owner-bar{
  color:#fff;text-align:center;padding:6px;font-size:.8rem;font-weight:600;display:none;
}
.owner-bar.on{display:block}
main{max-width:1100px;margin:0 auto;padding:14px 10px 50px}
.weeks{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.week-btn{
  background:var(--surface);backdrop-filter:blur(10px);border:1.5px solid var(--border);color:var(--text-secondary);
  padding:8px 18px;border-radius:var(--radius-pill);font-weight:600;box-shadow:var(--shadow);
}
.week-btn.on{background:var(--accent);border-color:var(--accent-hover);color:var(--accent-contrast)}
.week-title{font-size:1.15rem;font-weight:700;font-family:var(--font-display);color:var(--text-primary);margin-bottom:10px}
.week-title input{font-size:1rem;font-weight:700;border:1.5px solid var(--brown);border-radius:6px;padding:4px 8px;width:160px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);backdrop-filter:blur(12px);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{background:var(--surface-solid);color:var(--accent);font-size:.72rem;font-weight:600;padding:10px 2px;text-align:center;white-space:nowrap;border-right:1px solid var(--border)}
th.left{background:var(--brown-dark);min-width:68px;width:68px}
td{border:1px solid var(--border);vertical-align:top;padding:0}
.day{background:var(--surface-solid);text-align:center;padding:8px 2px;font-weight:700;font-size:.85rem;min-width:68px;width:68px;color:var(--text-primary)}
.day .d-name{display:block}
.day .d-date{display:block;font-weight:400;font-size:.68rem;color:var(--gray);margin-top:2px}
.day input{width:60px;font-size:.68rem;padding:2px;border:1px solid var(--border);border-radius:4px;margin-top:3px;text-align:center;background:var(--bg-elevated);color:var(--text-primary)}
.slot{
  height:92px;min-width:100px;padding:5px 5px;cursor:pointer;position:relative;background:transparent;
  transition:background .12s;
}
.slot:active{background:var(--blue-light)}
.slot.has{background:rgba(142,182,155,.07)}
.slot.done-green{background:rgba(159,216,179,.14) !important;border-left:3px solid var(--success)}
.slot.due-yellow{background:rgba(227,192,119,.14) !important;border-left:3px solid var(--warn)}
.slot.due-red{background:rgba(217,135,137,.14) !important;border-left:3px solid var(--danger)}
/* today / current-lesson highlight */
th.current-slot{background:var(--today) !important}
td.day.current-day{background:rgba(224,138,60,.14);border-left:3px solid var(--today)}
td.day.current-day .d-date{color:var(--today-dark);font-weight:700}
td.slot.current-day,td.slot.has.current-day{background:rgba(224,138,60,.10)}
td.slot.current-slot,td.slot.has.current-slot{background:rgba(224,138,60,.20);box-shadow:inset 0 0 0 2px var(--today)}
.subslot.current-day{background:rgba(224,138,60,.10)}
.subslot.current-slot{background:rgba(224,138,60,.20);box-shadow:inset 0 0 0 2px var(--today)}
.current-status{
  max-width:1100px;margin:0 auto 12px;padding:11px 16px;border-radius:14px;
  background:linear-gradient(90deg,var(--today),#EFA85F);color:#051F20;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  box-shadow:var(--shadow);font-size:.88rem;
}
.current-status.break-status{background:linear-gradient(90deg,var(--blue),var(--blue-dark))}
.current-status .status-time{font-size:.78rem;opacity:.9;white-space:nowrap}
.current-status .current-next{font-weight:600;margin-left:4px}

/* day view (NetSchool-style "today only" agenda) */
.day-view-header{max-width:900px;margin:0 auto 12px;text-align:center}
.day-view-header .dv-day{font-size:1.6rem;font-weight:600;font-family:var(--font-display);color:var(--text-primary)}
.day-view-header .dv-date{color:var(--gray);font-size:.88rem;margin-top:2px}
.dv-list{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:0 4px}
.dv-card{
  background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow);
  display:flex;gap:12px;align-items:flex-start;cursor:pointer;border-left:4px solid var(--blue-light);
}
.dv-card.has{border-left-color:var(--blue)}
.dv-card.done-green{background:rgba(159,216,179,.14);border-left-color:var(--success)}
.dv-card.due-yellow{background:rgba(227,192,119,.14);border-left-color:var(--warn)}
.dv-card.due-red{background:rgba(217,135,137,.14);border-left-color:var(--danger)}
.dv-card.current-slot{box-shadow:0 0 0 2px var(--today),var(--shadow)}
.dv-time{flex-shrink:0;width:64px;font-size:.82rem;font-weight:700;color:var(--blue-dark);line-height:1.3}
.dv-body{flex:1;min-width:0}
.dv-subj{font-weight:800;font-size:1.15rem;line-height:1.25}
.dv-subj.empty{color:var(--text-secondary);font-weight:500}
.dv-meta{font-size:.82rem;color:var(--gray);margin-top:2px}
.dv-empty-msg{max-width:900px;margin:30px auto;text-align:center;color:var(--gray)}
.dv-more{max-width:900px;margin:16px auto 0;text-align:center}
.dv-more button{width:100%}
.dv-nav{max-width:900px;margin:0 auto 12px;display:flex;align-items:center;gap:8px}
.dv-nav .day-view-header{flex:1;margin:0}
.dv-nav-btn{
  width:40px;height:40px;flex-shrink:0;border-radius:var(--radius-pill);
  background:var(--surface);backdrop-filter:blur(10px);border:1.5px solid var(--border);
  color:var(--text-primary);font-size:1.3rem;line-height:1;cursor:pointer;
}
.dv-nav-btn:disabled{opacity:.3;cursor:default}

/* literature (reading list) screen */
.lit-header{max-width:700px;margin:0 auto 14px}
.lit-header h2{font-size:1.15rem;color:var(--blue-dark);margin-bottom:10px}
.lit-search{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.95rem;background:var(--bg-elevated);color:var(--text-primary)}
.lit-search:focus{outline:none;border-color:var(--blue)}
#litList{max-width:700px;margin:0 auto}
.lit-subject{background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.lit-subject-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;cursor:pointer;font-weight:700;color:var(--blue-dark)}
.lit-count{background:var(--blue-light);color:var(--blue-dark);border-radius:10px;padding:1px 9px;font-size:.78rem;font-weight:600}
.lit-books{border-top:1px solid var(--border)}
.lit-book{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-size:.9rem;cursor:pointer;border-bottom:1px solid var(--border)}
.lit-book:last-child{border-bottom:none}
.lit-book:hover{background:var(--accent-soft)}
.lit-open{color:var(--blue);font-size:.82rem;font-weight:600;flex-shrink:0;margin-left:10px}

/* teachers directory */
#teachersScreen .lit-search{margin-bottom:14px}
.t-card{background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer}
.t-photo{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--accent-soft)}
.t-photo-ph{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text-primary)}
.t-name{font-weight:700}
.t-subjects{font-size:.82rem;color:var(--text-secondary);margin-top:2px}
.t-rating{margin-top:4px;font-size:.82rem;color:var(--warn);font-weight:600}
.t-rating .cnt{color:var(--text-secondary);font-weight:400}

.star-picker{display:flex;gap:4px;margin:8px 0 4px;flex-wrap:wrap}
.star-picker button{
  width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:transparent;
  color:var(--text-secondary);font-size:.85rem;font-weight:700;cursor:pointer;
}
.star-picker button.on{background:var(--warn);border-color:var(--warn);color:var(--accent-contrast)}

.review-row{background:rgba(255,255,255,.04);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px}
.review-row .rr-rating{font-weight:700;color:var(--warn);font-size:.9rem}
.review-row .rr-comment{font-size:.88rem;margin-top:3px}
.review-row.mine{border:1.5px solid var(--accent)}
.s-subj{font-weight:700;font-size:.78rem;color:var(--blue-dark);line-height:1.2;margin-bottom:1px;word-break:break-word;max-height:2.3em;overflow:hidden}
.s-meta{font-size:.66rem;color:var(--gray);line-height:1.2;max-height:2.5em;overflow:hidden}
.tag-dz{position:absolute;top:2px;right:2px;background:var(--success);color:#051F20;font-size:.55rem;font-weight:700;padding:1px 4px;border-radius:5px}
.tag-t{position:absolute;bottom:2px;right:2px;background:var(--brown);color:var(--black);font-size:.55rem;font-weight:700;padding:1px 4px;border-radius:5px}
/* split cell */
.slot.split{display:flex;padding:0;height:92px}
.subslot{
  flex:1;padding:5px 4px;border-right:1px dashed var(--border);position:relative;overflow:hidden;
}
.subslot:last-child{border-right:none}
.subslot.done-green{background:rgba(159,216,179,.14)}
.subslot.due-yellow{background:rgba(227,192,119,.14)}
.subslot.due-red{background:rgba(217,135,137,.14)}
.hint{text-align:center;padding:18px 12px;color:var(--gray);font-size:.9rem}
/* modals */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:200}
.ov.open{display:flex}
.mod{background:var(--surface-solid);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:600px){.ov{align-items:center;padding:16px}.mod{border-radius:16px;max-height:88vh}}
.mod-h{background:var(--surface-solid);color:var(--text-primary);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--border)}
.mod-h h3{font-family:var(--font-display);font-weight:600;font-size:1.05rem}
.mod-h h3{font-size:1.05rem;font-weight:700}
.mod-x{background:rgba(255,255,255,.1);color:var(--text-primary);width:30px;height:30px;border-radius:50%;font-size:1.2rem;display:flex;align-items:center;justify-content:center}
.mod-b{padding:16px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:.7rem;font-weight:600;color:var(--gray);margin-bottom:3px;text-transform:uppercase}
.fg input,.fg textarea{width:100%;padding:10px 11px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.94rem;font-family:inherit;background:var(--bg-elevated);color:var(--text-primary)}
.fg textarea{min-height:78px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info{background:var(--blue-light);border-radius:8px;padding:10px 12px;margin-bottom:9px}
.info .l{font-size:.66rem;color:var(--gray);font-weight:600;text-transform:uppercase}
.info .v{font-size:.94rem;font-weight:600}
.hw-files{margin:0 0 12px}
.hw-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.hw-imgs img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--border);display:block}
.hw-file{display:block;padding:9px 12px;margin-bottom:6px;border:1px solid var(--border);border-radius:10px;color:var(--text-primary);text-decoration:none;font-size:.88rem;word-break:break-all;background:var(--surface)}
.hw{background:var(--cream);border-left:4px solid var(--blue);padding:10px 12px;border-radius:0 8px 8px 0;white-space:pre-wrap;font-size:.9rem;margin-bottom:12px}
.topics{margin-top:12px;border-top:1px solid var(--border);padding-top:11px}
.topics h4{font-size:.9rem;color:var(--blue-dark);margin-bottom:8px}
.topic{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--accent-soft);border-radius:var(--radius-sm);margin-bottom:6px}
.topic.ok{background:rgba(159,216,179,.18)}
.topic .tt{flex:1;font-weight:500;font-size:.86rem}
.topic .tw{font-size:.74rem;color:var(--success);font-weight:600}
.add-t{display:flex;gap:6px;margin-top:6px}
.add-t input{flex:1;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.9rem;background:var(--bg-elevated);color:var(--text-primary)}
.acts{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.done-btn{
  width:100%;padding:12px;border-radius:10px;font-size:.95rem;font-weight:700;margin-top:8px;
  border:2px solid var(--success);background:rgba(159,216,179,.12);color:var(--success);
}
.done-btn.done{background:var(--success);color:#051F20}
.login-inner{text-align:center;padding:6px 0}
.login-inner input{width:100%;max-width:220px;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:1rem;text-align:center;margin:11px 0 13px;background:var(--bg-elevated);color:var(--text-primary)}
.err{color:var(--danger);font-size:.84rem;margin-top:8px;display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 20px;border-radius:24px;font-weight:600;font-size:.85rem;z-index:300;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.panel{background:var(--surface-solid);border-radius:var(--radius-md);border:1px solid var(--border);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h3{font-size:1rem;color:var(--blue-dark);margin-bottom:12px}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.stat-row:last-child{border-bottom:none}
.avatar-upload{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar-big{width:56px;height:56px;border-radius:50%;background:var(--brown);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.2rem;overflow:hidden}
.avatar-big img{width:100%;height:100%;object-fit:cover}
.split-toggle{margin:10px 0;padding:10px;background:var(--accent-soft);border-radius:var(--radius-sm);font-size:.9rem}
.teacher-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.teacher-row:last-child{border-bottom:none}
.avatar-sm{width:32px;height:32px;border-radius:50%;background:var(--brown);color:#fff;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.avatar-sm img{width:100%;height:100%;object-fit:cover}
.teacher-name{flex:1;font-size:.88rem;font-weight:500}
#errBox{background:#FEE2E2;color:#991B1B;padding:11px;margin:10px;border-radius:8px;font-size:.84rem;display:none}
</style>
</head>
<body>
<div class="owner-bar" id="ownerBar">Владелец · полный доступ</div>
<header>
  <div class="logo">📚 Домашка <span id="gBadge">Группа</span></div>
  <div class="header-right">
    <div class="user-chip" id="userChip">
      <div class="avatar" id="headerAvatar">?</div>
      <span id="nameText">Гость</span>
      <button class="edit-btn" id="editProfileBtn">изм.</button>
    </div>
    <button class="btn-outline btn-sm" id="importBtn" style="display:none">Импорт</button>
    <button class="btn-outline btn-sm" id="syncBtn" style="display:none">Обновить с сайта</button>
    <button class="btn-danger btn-sm" id="clearAllBtn" style="display:none">Очистить всё</button>
    <button class="btn-outline btn-sm" id="viewToggleBtn">2 недели</button>
    <button class="btn-outline btn-sm" id="litBtn">📚 Литература</button>
    <button class="btn-outline btn-sm" id="sessionsBtn">🗓️ Расписание сессий</button>
    <button class="btn-outline btn-sm" id="teachersBtn">👨‍🏫 Преподаватели</button>
  </div>

(function(){

  var TIMES=["08:30–10:00","10:15–11:45","12:00–13:30","14:10–15:35","15:45–17:10","17:20–18:45","18:50–20:15","20:20–21:50"];

  function emptySlot(){ return {subject:"",teacher:"",room:"",groups:"",hw:"",due:"",topics:[],done:{}} ; }
  function emptyWeek(n){
    return {title:"Неделя "+n, days:DAYS.map(function(name){

  function load(){

      var raw=localStorage.getItem(KEY);
      data=raw?JSON.parse(raw):defData();
      if(!data.weeks) data=defData();
      // migrate old format if needed
      data.weeks.forEach(function(w){
        w.days.forEach(function(d){
          d.slots.forEach(function(s,si){
            if(!s.parts){
              var old=s;
              d.slots[si]={split:false, parts:[{
                subject:old.subject||"", teacher:old.teacher||"", room:old.room||"",
                groups:old.groups||"", hw:old.hw||"", due:old.due||"", topics:old.topics||[], done:old.done||{}
              }]};
            }
          });
        });
      });
      // Weeks saved before Sunday existed have 6 days - top them up to 7.
      data.weeks.forEach(function(w){

    try{var ur=localStorage.getItem(UKEY); if(ur) user=JSON.parse(ur);}catch(e){}
    if(user.name){

      save();
    }
    updateUserUI();
  }
  function save(){ try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){} try{localStorage.setItem(UKEY,JSON.stringify(user));}catch(e){} }
  function updateUserUI(){
    document.getElementById("nameText").textContent=user.name||"Гость";

  function esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  // Resize + recompress a picked photo client-side so a normal phone photo
  // (often several MB) ends up as a tiny base64 string safe for localStorage.
  function compressImage(file, maxDim, quality, cb){
    if(!file || file.type.indexOf("image/")!==0){ cb(null); return; }
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        var canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        cb(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror=function(){ cb(null); };
      img.src=e.target.result;
    };
    reader.onerror=function(){ cb(null); };
    reader.readAsDataURL(file);
  }
  function toast(m){var el=document.getElementById("toast");el.textContent=m;el.classList.add("on");setTimeout(function(){el.classList.remove("on");},2200);}
  function showConfirm(msg, onYes){

    ov.querySelector("#confNo").onclick=function(){document.body.removeChild(ov);};
    ov.onclick=function(e){ if(e.target===ov) document.body.removeChild(ov); };
  }

  function daysUntil(dueStr){
    if(!dueStr) return null;
    var parts=dueStr.split(".");
    if(parts.length!==3) return null;
    var d=new Date(+parts[2], +parts[1]-1, +parts[0]);
    var today=new Date(); today.setHours(0,0,0,0);
    d.setHours(0,0,0,0);
    return Math.round((d-today)/86400000);
  }
  // "Лек./373 ауд." -> {type:"Лекция", number:"373"}; falls back to showing
  // the raw string as the room number if it doesn't match this shape.
  function parseRoomType(room){
    var m=/^(Лек|Пр|Лаб)\.?\s*\/\s*(.+?)\s*ауд\.?$/i.exec((room||"").trim());
    if(!m) return {type:"", number:(room||"").trim()};
    var typeMap={"лек":"Лекция","пр":"Практика","лаб":"Лабораторная"};
    return {type:typeMap[m[1].toLowerCase()]||m[1], number:m[2].trim()};
  }

  function statusClass(part){
    if(!user.name) return "";
    if(part.done && part.done[user.name]) return "done-green";
    var left=daysUntil(part.due);
    if(left===null) return "";
    if(left<=1) return "due-red";
    if(left<=2) return "due-yellow";
    return "";
  }

  function teacherPhoto(name){
    if(!name) return "";
    var key=name.trim();
    var t=data.teachers && data.teachers[key];
    return (t && t.photo) ? t.photo : "";
  }
  function allTeacherNames(){
    var set={};
    data.weeks.forEach(function(w){
      w.days.forEach(function(d){
        d.slots.forEach(function(s){
          s.parts.forEach(function(p){ if(p.teacher && p.teacher.trim()) set[p.teacher.trim()]=true; });
        });
      });
    });
    Object.keys(data.teachers||{}).forEach(function(n){ set[n]=true; });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b,"ru"); });
  }

  // Merge officially-scraped schedule data (subject/teacher/room/groups/date
  // only) without ever touching homework, due dates, topics or done-marks -
  // those live only in the browser and are never overwritten by a sync.
  function mergeOfficialSchedule(remote){
    if(!remote || !remote.weeks) return;
    remote.weeks.forEach(function(rw, wIdx){
      if(!data.weeks[wIdx]) return;
      (rw.days||[]).forEach(function(rd, dIdx){
        var localDay=data.weeks[wIdx].days[dIdx];
        if(!localDay) return;
        if(rd.date) localDay.date=rd.date;
        (rd.slots||[]).forEach(function(rs, sIdx){
          var localSlot=localDay.slots[sIdx];
          if(!localSlot || !rs) return;
          localSlot.split=!!rs.split;
          var rParts=rs.parts||[];
          rParts.forEach(function(rp, pIdx){
            if(!localSlot.parts[pIdx]) localSlot.parts[pIdx]=emptySlot();
            var lp=localSlot.parts[pIdx];
            lp.subject=rp.subject||""; lp.teacher=rp.teacher||"";
            lp.room=rp.room||""; lp.groups=rp.groups||"";
          });
          if(rParts.length && rParts.length<localSlot.parts.length){
            localSlot.parts=localSlot.parts.slice(0, Math.max(1,rParts.length));
          }
        });
      });
    });
    save();
  }

  // Turn Supabase's flat schedule_slots rows into the same {weeks:[...]}
  // shape mergeOfficialSchedule() already expects, so the merge logic
  // (and its "never touch homework" guarantee) stays exactly one code path
  // regardless of where the data came from.
  function rowsToWeeksShape(rows, teacherNameById){
    var weeks=[{days:[]},{days:[]}];
    for(var w=0; w<2; w++) for(var d=0; d<DAYS.length; d++)
      weeks[w].days.push({date:"", slots: TIMES.map(function(){ return {split:false, parts:[]}; })});
    (rows||[]).forEach(function(r){
      var wIdx=r.week_number-1;
      if(!weeks[wIdx]) return;
      var day=weeks[wIdx].days[r.day_index];
      if(!day) return;
      if(r.lesson_date){
        var m=String(r.lesson_date).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if(m) day.date=m[3]+"."+m[2]+"."+m[1];
      }
      var slot=day.slots[r.slot_index];
      if(!slot) return;
      if(r.part_index===1) slot.split=true;
      slot.parts[r.part_index]={
        subject:r.subject||"",
        teacher:r.teacher_id ? (teacherNameById[r.teacher_id]||"") : "",
        room:r.room||"",
        groups:r.groups_label||""
      };
    });
    weeks.forEach(function(w){ w.days.forEach(function(d){ d.slots.forEach(function(s){
      if(!s.parts[0]) s.parts[0]={subject:"",teacher:"",room:"",groups:""};
    }); }); });
    // Days without lessons (always Sunday, sometimes others) get no date from
    // the rows - count it from any dated day of the same week.
    weeks.forEach(function(w){
      var ai=-1, anchor=null;
      w.days.forEach(function(d,i){ if(ai<0 && d.date){ ai=i; anchor=d.date; } });
      if(ai<0) return;
      var m=anchor.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
      if(!m) return;
      w.days.forEach(function(d,i){
        if(d.date) return;
        var dt=new Date(+m[3], +m[2]-1, +m[1]+(i-ai));
        d.date=String(dt.getDate()).padStart(2,"0")+"."+String(dt.getMonth()+1).padStart(2,"0")+"."+dt.getFullYear();
      });
    });
    return {weeks:weeks};
  }

  function dmyToISO(dmy){
    var m=String(dmy||"").match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if(!m) return null;
    return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  }
  function isoToDMY(iso){
    var m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? (m[3]+"."+m[2]+"."+m[1]) : "";
  }

  // Pull homework/topics/done-marks for the group from Supabase and merge
  // them into the local slots. This OVERWRITES local hw/due/topics with the
  // shared version (that's the point - it's shared), but a student's own
  // "done" mark is looked up by their real Supabase user id, not the old
  // free-text display name, so it stays correct even if they retype their name.
  async function syncHomework(){
    if(!sb || !myGroupId || !myUserId) return;
    var slotIds=Object.keys(slotIdByKey).map(function(k){ return slotIdByKey[k]; });
    if(!slotIds.length) return;

    var hwRes=await sb.from("homework").select("id,schedule_slot_id,description,due_date,attachments").in("schedule_slot_id", slotIds);
    var hwByScheduleSlot={};
    (hwRes.data||[]).forEach(function(h){ hwByScheduleSlot[h.schedule_slot_id]=h; });

    var hwIds=(hwRes.data||[]).map(function(h){ return h.id; });
    var topicsByHw={};
    if(hwIds.length){
      var topicsRes=await sb.from("homework_topics").select("id,homework_id,title,booked_by,profiles(full_name)").in("homework_id", hwIds);
      (topicsRes.data||[]).forEach(function(t){
        if(!topicsByHw[t.homework_id]) topicsByHw[t.homework_id]=[];
        topicsByHw[t.homework_id].push({
          title:t.title,
          by:t.booked_by ? ((t.profiles&&t.profiles.full_name)||"кто-то") : "",
          _id:t.id, _bookedBy:t.booked_by
        });
      });
    }

    var doneRes=hwIds.length ? await sb.from("homework_done").select("homework_id").eq("user_id", myUserId) : {data:[]};
    var doneSet={};
    (doneRes.data||[]).forEach(function(d){ doneSet[d.homework_id]=true; });

    homeworkIdByKey={};
    Object.keys(slotIdByKey).forEach(function(key){
      var sid=slotIdByKey[key];
      var h=hwByScheduleSlot[sid];
      if(!h) return;
      homeworkIdByKey[key]=h.id;
      var parts=key.split(":");
      var w=+parts[0], d=+parts[1], t=+parts[2], p=+parts[3];
      var day=data.weeks[w] && data.weeks[w].days[d];
      var slot=day && day.slots[t];
      var localPart=slot && slot.parts[p];
      if(!localPart) return;
      localPart.hw=h.description||"";
      localPart.files=Array.isArray(h.attachments)?h.attachments:[];
      localPart.due=isoToDMY(h.due_date);
      localPart.topics=topicsByHw[h.id]||[];
      if(!localPart.done) localPart.done={};
      if(user.name){
        if(doneSet[h.id]) localPart.done[user.name]=true; else delete localPart.done[user.name];
      }
    });
    save();
  }

  async function ensureHomeworkRow(w,d,t,p){
    var key=w+":"+d+":"+t+":"+p;
    if(homeworkIdByKey[key]) return homeworkIdByKey[key];
    var sid=slotIdByKey[key];
    if(!sid || !sb) return null;
    var res=await sb.from("homework").insert({schedule_slot_id:sid}).select("id").single();
    if(res.error){ console.error(res.error); return null; }
    homeworkIdByKey[key]=res.data.id;
    return res.data.id;
  }

  async function pushHomeworkText(w,d,t,p,hwText,dueText){
    var hid=await ensureHomeworkRow(w,d,t,p);
    if(!hid || !sb) return;
    await sb.from("homework").update({description:hwText||null, due_date:dmyToISO(dueText)}).eq("id", hid);
  }


  async function syncFromSupabase(showFeedback){
    if(!sb){ if(showFeedback) toast("Supabase не подключен"); return; }
    try{
      var sess=await sb.auth.getSession();
      var session=sess.data.session;
      if(!session){
        console.warn("[sync] no Supabase session - user is not logged in");
        if(showFeedback) toast("Сначала войди через страницу входа");
        return;
      }
      myUserId=session.user.id;

      if(!myGroupId){
        var prof=await sb.from("profiles").select("group_id, full_name, is_owner").eq("id", session.user.id).maybeSingle();
        if(prof.error){ console.error("[sync] profile fetch error:", prof.error); throw new Error("профиль: "+prof.error.message); }
        if(!prof.data || !prof.data.group_id){
          console.warn("[sync] profile has no group_id - was join_by_roster ever run for this user?", prof.data);
          toast("Профиль ещё не привязан к группе");
          return;
        }
        myGroupId=prof.data.group_id;
        myIsOwner=!!prof.data.is_owner;
        if(!user.name && prof.data.full_name){ user.name=prof.data.full_name; }
        console.log("[sync] resolved group_id:", myGroupId, "is_owner:", myIsOwner);
      }
      await sb.from("profiles").update({last_seen_at:new Date().toISOString()}).eq("id", session.user.id);

      var teachersRes=await sb.from("teachers").select("id, full_name").eq("group_id", myGroupId);
      var teacherNameById={};
      (teachersRes.data||[]).forEach(function(t){ teacherNameById[t.id]=t.full_name; });

      var slotsRes=await sb.from("schedule_slots").select("*").eq("group_id", myGroupId);
      if(slotsRes.error) throw new Error("schedule_slots: "+slotsRes.error.message);
      console.log("[sync] schedule_slots rows for my group:", (slotsRes.data||[]).length);
      if(!slotsRes.data || !slotsRes.data.length){
        console.warn("[sync] zero schedule rows for group_id", myGroupId, "- either the scraper hasn't written this group yet, or group_id mismatch");
        toast("В базе пока нет расписания для твоей группы");
      }

      slotIdByKey={};
      (slotsRes.data||[]).forEach(function(r){
        var key=(r.week_number-1)+":"+r.day_index+":"+r.slot_index+":"+r.part_index;
        slotIdByKey[key]=r.id;
      });

      mergeOfficialSchedule(rowsToWeeksShape(slotsRes.data, teacherNameById));
      await syncHomework();
      render();
      if(showFeedback) toast("Расписание обновлено");
    }catch(e){
      console.error("[sync] failed:", e);
      toast("Не удалось обновить: "+e.message);
    }
  }

  function render(){
    try{
      document.getElementById("gBadge").textContent=data.group||"Группа";
      document.body.classList.toggle("theme-owner", myIsOwner);
      document.getElementById("ownerBar").className="owner-bar"+(myIsOwner?" on":"");
      document.getElementById("importBtn").style.display=myIsOwner?"inline-block":"none";
      document.getElementById("syncBtn").style.display=myIsOwner?"inline-block":"none";
      document.getElementById("clearAllBtn").style.display=myIsOwner?"inline-block":"none";
      document.getElementById("weeks").innerHTML="";
      document.getElementById("viewToggleBtn").textContent=(viewMode==="day")?"2 недели":"← Сегодня";
      if(viewMode==="day") drawDayView(); else drawTable();
      if(myIsOwner) drawOwnerPanel(); else document.getElementById("ownerPanel").style.display="none";
    }catch(e){document.getElementById("errBox").style.display="block";document.getElementById("errBox").textContent="Ошибка: "+e.message;}
  }

  function getTodayInfo(){
    var now=new Date();
    var dayIndex=(now.getDay()+6)%7; // Mon=0 ... Sun=6
    var mins=now.getHours()*60+now.getMinutes();
    var slot=-1, br=false, next=-1;
    for(var i=0;i<TIMES.length;i++){
      var m=TIMES[i].match(/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/);
      if(!m) continue;
      var st=+m[1]*60 + +m[2], en=+m[3]*60 + +m[4];
      if(mins>=st && mins<en){ slot=i; break; }
      if(mins<st){ next=i; br=true; break; }
    }
    if(slot<0 && next<0) next=-1;
    return {now:now,day:dayIndex,slot:slot,week:-1,break:br,next:next};
  }

  function weekMatchesToday(w){
    var today=new Date();
    today.setHours(0,0,0,0);
    for(var d=0;d<w.days.length;d++){
      var ds=w.days[d].date;
      if(!ds) continue;
      var m=ds.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
      if(!m) continue;
      var dt=new Date(+m[3],+m[2]-1,+m[1]); dt.setHours(0,0,0,0);
      if(dt.getTime()===today.getTime()) return true;
    }
    return false;
  }

  function timeToMinutes(str){
    var m=str.match(/(\d{1,2}):(\d{2})/); return m ? (+m[1]*60 + +m[2]) : null;
  }

  function hasContentFrom(weekIdx, dayIdx, fromSlot){
    if(weekIdx<0 || dayIdx<0 || !data.weeks[weekIdx]) return false;
    var day=data.weeks[weekIdx].days[dayIdx];
    if(!day) return false;
    for(var k=fromSlot;k<day.slots.length;k++){
      var slot=day.slots[k];
      for(var p=0;p<slot.parts.length;p++){ if(slot.parts[p] && slot.parts[p].subject) return true; }
    }
    return false;
  }

  function currentWeekIndex(info){
    if(info.day<0) return -1;
    for(var w=0;w<data.weeks.length;w++) if(weekMatchesToday(data.weeks[w])) return w;
    // If dates are not entered, use the first week as the active one.
    return data.weeks.length ? 0 : -1;
  }

  // Saturday/Sunday never have lessons - jump straight to the upcoming
  // Monday instead of showing an empty "today" screen.
  function resolveDisplayDay(){
    var now=new Date();
    var jsDay=now.getDay(); // 0=Sun,1=Mon,...,6=Sat
    var isWeekend=(jsDay===0 || jsDay===6);
    var targetDate=new Date(now); targetDate.setHours(0,0,0,0);
    if(isWeekend){
      targetDate.setDate(targetDate.getDate() + (jsDay===6 ? 2 : 1));
    }
    for(var w=0; w<data.weeks.length; w++){
      var days=data.weeks[w].days;
      for(var d=0; d<days.length; d++){
        var ds=days[d].date;
        if(!ds) continue;
        var m=ds.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
        if(!m) continue;
        var dt=new Date(+m[3],+m[2]-1,+m[1]); dt.setHours(0,0,0,0);
        if(dt.getTime()===targetDate.getTime()) return {week:w, day:d, isWeekend:isWeekend};
      }
    }
    // Dates not populated yet - fall back to plain day-of-week (Monday=0).
    var dayIndex=isWeekend ? 0 : (jsDay+6)%7;
    return {week: data.weeks.length?0:-1, day: dayIndex, isWeekend:isWeekend};
  }

  function renderCurrentStatus(info, activeWeek){
    var el=document.getElementById("currentStatus");
    if(!el) return;
    if(info.day<0 || activeWeek<0){
      el.style.display="none"; return;
    }
    var dayName=DAYS[info.day];
    var nowStr=info.now.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    if(info.slot>=0){
      var range=TIMES[info.slot];
      var subject="";
      var slot=data.weeks[activeWeek].days[info.day].slots[info.slot];
      if(slot){
        subject=slot.parts[0]&&slot.parts[0].subject ? slot.parts[0].subject : "";
        if(slot.split && slot.parts[1]&&slot.parts[1].subject){
          subject=subject ? subject+" · "+slot.parts[1].subject : slot.parts[1].subject;
        }
      }
      if(!subject){ el.style.display="none"; return; } // no lesson right now (e.g. Sunday)
      el.className="current-status";
      el.innerHTML='<div><strong>Сейчас · '+dayName+' · '+(info.slot+1)+'-я пара</strong>'+
        (subject?' · '+esc(subject):'')+'</div><div class="status-time">'+nowStr+' · '+range+'</div>';
    }else if(info.break && info.next>=0){
      var nextSlot=data.weeks[activeWeek].days[info.day].slots[info.next];
      var nextSub="";
      if(nextSlot){
        nextSub=nextSlot.parts[0]&&nextSlot.parts[0].subject ? nextSlot.parts[0].subject : "";
        if(nextSlot.split && nextSlot.parts[1]&&nextSlot.parts[1].subject){
          nextSub=nextSub ? nextSub+" · "+nextSlot.parts[1].subject : nextSlot.parts[1].subject;
        }
      }
      el.className="current-status break-status";
      el.innerHTML='<div><strong>Перемена</strong> · '+dayName+
        (nextSub?' <span class="current-next">Следующая: '+esc(nextSub)+'</span>':'')+
        '</div><div class="status-time">'+nowStr+'</div>';
    }else{
      el.style.display="none";
      return;
    }
    el.style.display="flex";
  }

  function drawDayView(){
    var html="";
    var info=getTodayInfo();
    if(dayViewAbsIndex===null){
      var display0=resolveDisplayDay();
      dayViewAbsIndex=(display0.week>=0 && display0.day>=0) ? (display0.week*7+display0.day) : 0;
    }
    var activeWeek=Math.floor(dayViewAbsIndex/7);
    var showDay=dayViewAbsIndex%7;
    var liveWeek=currentWeekIndex(info);
    var jsDay=new Date().getDay();
    var isWeekendNow=(jsDay===0 || jsDay===6);
    var isLiveToday=!isWeekendNow && activeWeek===liveWeek && showDay===info.day;
    var showWeekendBanner=false;
    if(isWeekendNow){
      var redirectTarget=resolveDisplayDay();
      showWeekendBanner=(redirectTarget.week===activeWeek && redirectTarget.day===showDay);
    }
    if(isLiveToday && info.break && info.next>=0 && !hasContentFrom(activeWeek, info.day, info.next)){
      info.break=false; info.next=-1;
    }
    html+='<div id="currentStatus" class="current-status" style="display:none"></div>';

    if(activeWeek<0 || activeWeek>1 || !data.weeks[activeWeek] || !data.weeks[activeWeek].days[showDay]){
      html+='<div class="day-view-header"><div class="dv-day">Расписание пока пустое</div>'+
            '<div class="dv-date">Загляни на «2 недели», как только появятся данные</div></div>';
      document.getElementById("area").innerHTML=html;
      return;
    }

    var day=data.weeks[activeWeek].days[showDay];
    html+='<div class="dv-nav">';
    html+='<button id="dvPrev" class="dv-nav-btn"'+(dayViewAbsIndex<=0?' disabled':'')+'>‹</button>';
    html+='<div class="day-view-header"><div class="dv-day">'+day.name+'</div>';
    if(showWeekendBanner) html+='<div class="dv-date" style="color:var(--today-dark);font-weight:600">Сегодня выходной — показываю ближайший понедельник</div>';
    html+='<div class="dv-date">'+(day.date?esc(day.date):'')+'</div></div>';
    html+='<button id="dvNext" class="dv-nav-btn"'+(dayViewAbsIndex>=13?' disabled':'')+'>›</button>';
    html+='</div>';

    html+='<div class="dv-list">';
    var shown=0;
    for(var si=0; si<day.slots.length; si++){
      var slot=day.slots[si];
      var isCurrentSlot=(isLiveToday && si===info.slot);
      for(var pi=0; pi<slot.parts.length; pi++){
        var part=slot.parts[pi];
        var has=part.subject||part.hw||(part.topics&&part.topics.length);
        if(!has && !myIsOwner) continue; // students only see actual lessons
        if(!has && myIsOwner && pi>0) continue; // don't spam empty split-halves for the owner either
        shown++;
        var sc=statusClass(part);
        var tn=part.topics?part.topics.length:0;
        var tk=part.topics?part.topics.filter(function(x){return x.by;}).length:0;
        html+='<div class="dv-card '+(has?"has ":"")+sc+(isCurrentSlot?" current-slot":"")+'" data-w="'+activeWeek+'" data-d="'+showDay+'" data-t="'+si+'" data-part="'+pi+'">';
        html+='<div class="dv-time">'+TIMES[si].replace('–','–<br>')+'</div>';
        html+='<div class="dv-body">';
        if(part.hw||tn||(part.files&&part.files.length)) html+='<span class="tag-dz">ДЗ</span>';
        if(tn) html+='<span class="tag-t">'+tk+'/'+tn+'</span>';
        html+='<div class="dv-subj'+(has?'':' empty')+'">'+(part.subject?esc(part.subject):(myIsOwner?'Добавить пару':'—'))+'</div>';
        var roomInfo=parseRoomType(part.room);
        var metaBits=[];
        if(roomInfo.number) metaBits.push(esc(roomInfo.number));
        if(roomInfo.type) metaBits.push(esc(roomInfo.type));
        if(metaBits.length) html+='<div class="dv-meta">'+metaBits.join(' · ')+'</div>';
        html+='</div></div>';
      }
    }
    if(!shown){
      html+='</div><div class="dv-empty-msg">Пар не найдено'+(myIsOwner?' — переключись на «2 недели», чтобы добавить':'')+'.</div>';
    } else {
      html+='</div>';
    }
    html+='<div class="dv-more"><button class="btn-outline" id="dvMoreBtn">Показать на 2 недели</button></div>';

    document.getElementById("area").innerHTML=html;
    if(isLiveToday) renderCurrentStatus(info,activeWeek);

    var dvMore=document.getElementById("dvMoreBtn");
    if(dvMore) dvMore.onclick=function(){ viewMode="grid"; localStorage.setItem("domashka_view_v1","grid"); render(); };

    var dvPrev=document.getElementById("dvPrev");
    if(dvPrev) dvPrev.onclick=function(){ if(dayViewAbsIndex>0){ dayViewAbsIndex--; render(); } };
    var dvNext=document.getElementById("dvNext");
    if(dvNext) dvNext.onclick=function(){ if(dayViewAbsIndex<13){ dayViewAbsIndex++; render(); } };

    var cards=document.getElementById("area").querySelectorAll(".dv-card");
    for(var c=0;c<cards.length;c++){
      cards[c].onclick=function(){
        cur={w:+this.getAttribute("data-w"),d:+this.getAttribute("data-d"),t:+this.getAttribute("data-t")};
        activePart=+this.getAttribute("data-part");
        openModal();
      };
    }
  }

          } else {

            var tk=part.topics?part.topics.filter(function(x){return x.by;}).length:0;

            if(tn) html+='<span class="tag-t">'+tk+'/'+tn+'</span>';

    document.getElementById("area").innerHTML=html;

    if(myIsOwner){
      var wts=document.getElementById("area").querySelectorAll(".wt-input");

  function renderLitList(query){
    var list=document.getElementById("litList");
    if(!literatureBooks.length){
      list.innerHTML='<div class="dv-empty-msg">Пока ничего нет'+(myIsOwner?' — нажми «Добавить книгу»':'')+'.</div>';
      return;
    }
    var filtered=literatureBooks.filter(function(b){
      if(!query) return true;
      return b.subject.toLowerCase().indexOf(query)!==-1 || b.title.toLowerCase().indexOf(query)!==-1;
    });
    var bySubject={};
    filtered.forEach(function(b){ (bySubject[b.subject]=bySubject[b.subject]||[]).push(b); });
    var subjects=Object.keys(bySubject).sort(function(a,b){ return a.localeCompare(b,"ru"); });
    if(!subjects.length){ list.innerHTML='<div class="dv-empty-msg">Ничего не найдено</div>'; return; }
    var h="";
    subjects.forEach(function(subj){
      h+='<div class="lit-subject">';
      h+='<div class="lit-subject-head"><span>'+esc(subj)+'</span><span class="lit-count">'+bySubject[subj].length+'</span></div>';
      h+='<div class="lit-books" style="display:'+(query?'block':'none')+'">';
      bySubject[subj].forEach(function(b){
        h+='<div class="lit-book" data-id="'+b.id+'"><span>'+esc(b.title)+'</span><span class="lit-open">Открыть →</span></div>';
      });
      h+='</div></div>';
    });
    list.innerHTML=h;
    var heads=list.querySelectorAll(".lit-subject-head");
    for(var i=0;i<heads.length;i++){
      heads[i].onclick=function(){
        var booksEl=this.parentElement.querySelector(".lit-books");
        booksEl.style.display=(booksEl.style.display==="none")?"block":"none";
      };
    }
    var bookEls=list.querySelectorAll(".lit-book");
    for(var j=0;j<bookEls.length;j++){

  async function uploadBook(){
    var subject=document.getElementById("litSubjInput").value.trim();
    var title=document.getElementById("litTitleInput").value.trim();
    var file=document.getElementById("litFileInput").files[0];
    if(!subject||!title||!file){ toast("Заполни все поля и выбери файл"); return; }
    if(file.type!=="application/pdf"){ toast("Только PDF-файлы"); return; }
    if(file.size>50*1024*1024){ toast("Файл слишком большой (макс. 50МБ)"); return; }
    var safeName=title.replace(/[^a-zA-Zа-яА-Я0-9_.-]/g,"_").slice(0,60)+".pdf";
    var path=myGroupId+"/"+Date.now()+"-"+safeName;
    toast("Загружаю...");
    var upRes=await sb.storage.from("literature").upload(path, file, {contentType:"application/pdf"});
    if(upRes.error){ toast("Ошибка загрузки: "+upRes.error.message); return; }
    var insRes=await sb.from("literature_books").insert({
      group_id:myGroupId, subject:subject, title:title, storage_path:path, file_size:file.size, uploaded_by:myUserId
    });
    if(insRes.error){ toast("Файл загружен, но не сохранился в списке: "+insRes.error.message); return; }
    close1();
    toast("Книга добавлена");
    await loadAndDrawLiterature();
  }

  async function loadAndDrawTeachers(){
    var el=document.getElementById("teachersScreen");
    el.innerHTML='<div class="dv-empty-msg">Загрузка...</div>';
    if(!sb || !myGroupId){ el.innerHTML='<div class="dv-empty-msg">Supabase не подключён</div>'; return; }

    var teachersRes=await sb.from("teachers").select("id,full_name,photo_url").eq("group_id",myGroupId);
    if(teachersRes.error){ el.innerHTML='<div class="dv-empty-msg">Ошибка: '+esc(teachersRes.error.message)+'</div>'; return; }
    var rows=teachersRes.data||[];
    if(!rows.length){ el.innerHTML='<div class="lit-header"><h2>👨‍🏫 Преподаватели</h2></div><div class="dv-empty-msg">Пока пусто — появятся, как только подтянется расписание</div>'; return; }

    var teacherIds=rows.map(function(t){return t.id;});
    var slotsRes=await sb.from("schedule_slots").select("teacher_id,subject").eq("group_id",myGroupId);
    var subjByTeacher={};
    (slotsRes.data||[]).forEach(function(s){
      if(!s.teacher_id || !s.subject) return;
      var set=subjByTeacher[s.teacher_id]=subjByTeacher[s.teacher_id]||{};
      set[s.subject]=true;
    });

    var reviewsRes=await sb.from("teacher_reviews").select("teacher_id,student_id,rating,comment").in("teacher_id",teacherIds);
    var reviewsByTeacher={};
    (reviewsRes.data||[]).forEach(function(r){ (reviewsByTeacher[r.teacher_id]=reviewsByTeacher[r.teacher_id]||[]).push(r); });

    teacherDirectory=rows.map(function(t){
      var revs=reviewsByTeacher[t.id]||[];
      var avg=revs.length ? (revs.reduce(function(s,r){return s+r.rating;},0)/revs.length) : null;
      var mine=myUserId ? revs.find(function(r){ return r.student_id===myUserId; }) : null;
      return {
        id:t.id, full_name:t.full_name, photo_url:t.photo_url,
        subjects:Object.keys(subjByTeacher[t.id]||{}),
        avg:avg, count:revs.length, reviews:revs, myReview:mine||null
      };
    });
    teacherDirectory.sort(function(a,b){ return a.full_name.localeCompare(b.full_name,"ru"); });

    renderTeachersList();
  }

  function renderTeacherCards(query){
    var body=document.getElementById("teacherListBody");
    var filtered=teacherDirectory.filter(function(t){
      if(!query) return true;
      return t.full_name.toLowerCase().indexOf(query)!==-1 || t.subjects.some(function(s){return s.toLowerCase().indexOf(query)!==-1;});
    });
    if(!filtered.length){ body.innerHTML='<div class="dv-empty-msg">Ничего не найдено</div>'; return; }
    var h="";
    filtered.forEach(function(t){
      var initials=t.full_name.split(/\s+/).map(function(w){return w[0];}).slice(0,2).join("").toUpperCase();
      h+='<div class="t-card" data-id="'+t.id+'">';
      h+=t.photo_url ? '<img class="t-photo" src="'+esc(t.photo_url)+'">' : '<div class="t-photo-ph">'+esc(initials)+'</div>';
      h+='<div><div class="t-name">'+esc(t.full_name)+'</div>';
      h+='<div class="t-subjects">'+(t.subjects.length?esc(t.subjects.join(", ")):"Предметы не найдены")+'</div>';
      h+='<div class="t-rating">'+(t.avg!==null?('★ '+t.avg.toFixed(1)+' <span class="cnt">('+t.count+')</span>'):'<span class="cnt">Пока нет отзывов</span>')+'</div>';
      h+='</div></div>';
    });
    body.innerHTML=h;
    var cards=body.querySelectorAll(".t-card");
    for(var i=0;i<cards.length;i++){
      cards[i].onclick=function(){ openTeacherDetail(this.getAttribute("data-id")); };

      });

        var ph="";
        for(var i=1;i<=10;i++) ph+='<button type="button" class="'+(i<=selected?"on":"")+'" data-n="'+i+'">'+i+'</button>';

        for(var j=0;j<btns.length;j++){
          btns[j].onclick=function(){ selected=+this.getAttribute("data-n"); drawPicker(); };

  async function submitReview(t, rating, comment){
    if(!sb || !myUserId) return;
    var btn=document.getElementById("submitReviewBtn");
    btn.disabled=true; btn.textContent="Сохраняем...";
    try{
      var res=await sb.from("teacher_reviews")
        .upsert({teacher_id:t.id, student_id:myUserId, rating:rating, comment:comment||null}, {onConflict:"teacher_id,student_id"});
      if(res.error){ toast("Ошибка: "+res.error.message); return; }
      toast("Отзыв сохранён");
      document.getElementById("ov1").classList.remove("open");
      await loadAndDrawTeachers();
      if(showingTeachers) renderTeachersList();

      if(btn){ btn.disabled=false; btn.textContent="Оставить отзыв"; }
    }
  }

  async function loadStudentsPanel(){
    var body=document.getElementById("studentsPanelBody");
    if(!body) return;
    if(!sb || !myGroupId){ body.innerHTML='<p style="color:var(--text-secondary);font-size:.9rem">Supabase не подключён</p>'; return; }
    if(!myIsOwner){
      body.innerHTML='<p style="color:var(--text-secondary);font-size:.9rem">Этот раздел виден только настоящему владельцу (нужен вход через страницу регистрации с реальным is_owner, а не просто локальный пароль).</p>';
      return;
    }
    var res=await sb.from("profiles").select("id,full_name,trial_until,paid_until,last_seen_at,referred_by,created_at").eq("group_id", myGroupId);
    if(res.error){ body.innerHTML='<p style="color:#DC2626;font-size:.9rem">Ошибка: '+esc(res.error.message)+'</p>'; return; }
    var rows=res.data||[];

    var refCounts={};
    rows.forEach(function(r){ if(r.referred_by) refCounts[r.referred_by]=(refCounts[r.referred_by]||0)+1; });

    var now=new Date();
    function fmtDate(iso){
      var d=new Date(iso);
      return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
    }
    function fmtLastSeen(iso){
      if(!iso) return "ни разу не заходил(а)";
      var d=new Date(iso);
      var diffH=(now-d)/3600000;
      if(diffH<1) return "только что";
      if(diffH<24) return "сегодня";
      if(diffH<48) return "вчера";
      return fmtDate(iso);
    }
    function statusFor(r){
      var paid=r.paid_until && new Date(r.paid_until) > now;
      var trial=r.trial_until && new Date(r.trial_until) > now;
      if(paid) return {label:"Оплачено до "+fmtDate(r.paid_until), bg:"rgba(159,216,179,.16)", fg:"#9FD8B3"};
      if(trial) return {label:"Пробный до "+fmtDate(r.trial_until), bg:"rgba(227,192,119,.16)", fg:"#E3C077"};
      return {label:"Не оплачено", bg:"rgba(217,135,137,.16)", fg:"#D98789"};
    }

    rows.sort(function(a,b){ return (b.last_seen_at||"").localeCompare(a.last_seen_at||""); });

    var h="";
    if(!rows.length){
      h='<p style="color:var(--text-secondary);font-size:.9rem">Пока никто не зарегистрировался</p>';
    } else {
      rows.forEach(function(r){
        var st=statusFor(r);
        h+='<div class="stat-row"><span>'+esc(r.full_name||"Без имени")+'</span>'+
           '<span style="background:'+st.bg+';color:'+st.fg+';padding:2px 8px;border-radius:6px;font-size:.78rem;font-weight:600">'+st.label+'</span></div>';
        h+='<div style="font-size:.78rem;color:var(--text-secondary);margin:-6px 0 10px 2px">Был(а): '+fmtLastSeen(r.last_seen_at)+' · Привёл(а): '+(refCounts[r.id]||0)+'</div>';
      });
    }
    body.innerHTML=h;
  }

    var h='<div class="hw-files">';

    });
    return h+'</div>';
  }

  function saveSlot(){
    var slot=data.weeks[cur.w].days[cur.d].slots[cur.t];
    var part=slot.parts[activePart];
    var wasEmpty=!part.subject;
    part.subject=document.getElementById("f1").value.trim();
    part.teacher=document.getElementById("f2").value.trim();
    part.room=document.getElementById("f3").value.trim();
    part.groups=document.getElementById("f4").value.trim();
    part.hw=document.getElementById("f5").value.trim();
    part.due=document.getElementById("fDue").value.trim();
    if(wasEmpty&&part.subject&&user.name){

      data.stats[user.name].cells=(data.stats[user.name].cells||0)+1;
    }

    pushHomeworkText(w0,d0,t0,p0,part.hw,part.due);

    if(sb){
      var hid=await ensureHomeworkRow(cur.w,cur.d,cur.t,activePart);
      if(hid){
        var res=await sb.from("homework_topics").insert({homework_id:hid, title:title}).select("id").single();

  async function toggleDone(){
    if(!user.name){toast("Сначала укажи имя");document.getElementById("editProfileBtn").click();return;}
    var part=data.weeks[cur.w].days[cur.d].slots[cur.t].parts[activePart];
    if(!part.done) part.done={};
    var nowDone;
    if(part.done[user.name]){ delete part.done[user.name]; nowDone=false; }
    else { part.done[user.name]=true; nowDone=true; }
    var w0=cur.w, d0=cur.d, t0=cur.t, p0=activePart;
    save(); close1(); render();
    toast(nowDone?"Отмечено выполненным":"Отметка снята");
    if(sb && myUserId){
      var hid=await ensureHomeworkRow(w0,d0,t0,p0);
      if(hid){
        if(nowDone) await sb.from("homework_done").insert({homework_id:hid, user_id:myUserId});

  document.getElementById("doImport").onclick = function(){
    var text=document.getElementById("importText").value;
    if(!text || !text.trim()){ toast("Вставь текст расписания"); return; }
    text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");

    var dayMap={"пн":0,"понедельник":0,"вт":1,"вторник":1,"ср":2,"среда":2,"чт":3,"четверг":3,"пт":4,"пятница":4,"сб":5,"суббота":5,"вс":6,"воскресенье":6};
    var currentWeek=0,currentDay=-1,columnIndex=0,filled=0,splitFilled=0;

    function isDateOnly(s){return /^\d{1,2}\.\d{1,2}\.\d{4}$/.test(s);}
    function isWeekLine(s){return /^\d+\s*недел/i.test(s);}
    function isTimeHeaderLine(s){return (s.match(/\d{1,2}[:.]\d{2}/g)||[]).length>=2;}
    // Accepts: "123(1) гр.", "123 (2) гр.", "123, 124 (1) гр." and similar.
    function isGroupsLine(s){return /^[\d\s,./-]*\(\s*[123]\s*\)\s*гр\.?\s*$/i.test(s) || /^[\d\s,./-]+\s*гр\.?\s*$/i.test(s);}
    function groupsParenNum(s){var m=s.match(/\(\s*(\d+)\s*\)/);return m?parseInt(m[1],10):null;}
    function isRoomLine(s){return /^(лек|пр|лаб)\.?\s*\/.*ауд/i.test(s)||/ауд\.?\s*$/i.test(s)||/^\d+\s*(ауд|каб)\.?$/i.test(s);}
    function isTeacherLine(s){return /^[А-ЯЁA-Z][а-яёa-z-]+(\s+[А-ЯЁA-Z]\.){1,2}\s*$/.test(s);}

    function blankPart(){
      return {subject:"",teacher:"",room:"",groups:"",hw:"",due:"",topics:[],done:{}};
    }

    function parseOne(lines){
      var out=blankPart();
      for(var i=0;i<lines.length;i++){
        var l=lines[i];
        if(isGroupsLine(l) && !out.groups) out.groups=l;
        else if(isRoomLine(l) && !out.room) out.room=l;
        else if(isTeacherLine(l) && out.subject && !out.teacher) out.teacher=l;
        else out.subject=(out.subject?out.subject+" ":"")+l;
      }
      return out;
    }

    // A copied cell may contain both subgroup 1 and subgroup 2.
    // Split it by group markers instead of treating the whole cell as one subject.
    function parseCell(lines){
      var entries=[], current=[];
      for(var i=0;i<lines.length;i++){
        if(isGroupsLine(lines[i]) && current.length && entries.length){
          entries.push(current); current=[lines[i]];
        }else{
          current.push(lines[i]);
        }
      }
      if(current.length) entries.push(current);

      var parsed=[];
      for(var j=0;j<entries.length;j++){
        var p=parseOne(entries[j]);
        if(p.subject||p.groups) parsed.push(p);
      }

      // If there are two explicit subgroup entries, preserve both.
      if(parsed.length>=2){
        var a=null,b=null,other=[];
        parsed.forEach(function(p){
          var n=groupsParenNum(p.groups);
          if(n===1 && !a) a=p;
          else if(n===2 && !b) b=p;
          else other.push(p);
        });
        if(a&&b) return [a,b].concat(other);
      }
      return parsed;
    }

    function putPart(slot,part,partIndex){
      if(!part || (!part.subject&&!part.groups)) return;
      var clean={
        subject:(part.subject||"").substring(0,100),
        teacher:(part.teacher||"").substring(0,60),
        room:(part.room||"").substring(0,40),
        groups:(part.groups||"").substring(0,50),
        hw:"",due:"",topics:[],done:{}
      };
      if(partIndex===0 && !slot.parts[0].subject && !slot.parts[0].groups){
        slot.parts[0]=clean;
      }else if(partIndex===1){
        slot.split=true;
        if(slot.parts.length<2) slot.parts.push(blankPart());
        slot.parts[1]=clean;
      }else if(!slot.parts[0].subject && !slot.parts[0].groups){
        slot.parts[0]=clean;
      }else{
        slot.split=true;
        if(slot.parts.length<2) slot.parts.push(blankPart());
        slot.parts[1]=clean;
      }
      filled++;
    }

    function assignParsed(parsed){
      if(!parsed.length || currentDay<0 || columnIndex<0 || columnIndex>7) return;
      var slot=data.weeks[currentWeek].days[currentDay].slots[columnIndex];

      // Best case: both subgroups are inside the same copied cell.
      if(parsed.length>=2){
        var p1=parsed.filter(function(p){return groupsParenNum(p.groups)===1;})[0];
        var p2=parsed.filter(function(p){return groupsParenNum(p.groups)===2;})[0];
        if(p1&&p2){
          putPart(slot,p1,0); putPart(slot,p2,1); splitFilled++; return;
        }
      }

      // One entry in a cell: if it explicitly says subgroup 1/2, pair by the
      // same timetable column. This handles sites that copy the two subgroup
      // rows into adjacent fragments.
      var p=parsed[0];
      var n=groupsParenNum(p.groups);
      if(n===1){
        putPart(slot,p,0);
      }else if(n===2){
        // Prefer the same time slot. If subgroup 1 is already there, place #2.
        if(slot.parts[0].subject||slot.parts[0].groups){
          putPart(slot,p,1); splitFilled++;
        }else{
          // Fallback for a site that places (2) before (1).
          putPart(slot,p,0);
        }
      }else{
        putPart(slot,p,0);
      }
    }

    // Keep empty tabs: their position is meaningful in copied HTML tables.
    var chunks=text.split("\t");
    for(var c=0;c<chunks.length;c++){
      var lines=chunks[c].split("\n").map(function(l){return l.trim();}).filter(function(l){return l.length>0;});
      var li=0;
      while(li<lines.length){
        var lo=lines[li].toLowerCase();
        if(isWeekLine(lo)){
          currentWeek=/^2/.test(lo)?1:0;
          currentDay=-1;columnIndex=0;li++;continue;
        }
        if(dayMap.hasOwnProperty(lo)){
          currentDay=dayMap[lo];columnIndex=0;li++;
          if(li<lines.length && isDateOnly(lines[li])){
            if(data.weeks[currentWeek]&&data.weeks[currentWeek].days[currentDay]) data.weeks[currentWeek].days[currentDay].date=lines[li];
            li++;
          }
          continue;
        }
        if(isTimeHeaderLine(lines[li])){li++;continue;}
        break;
      }
      var contentLines=lines.slice(li);
      if(currentDay>=0 && contentLines.length) assignParsed(parseCell(contentLines));
      if(currentDay>=0) columnIndex++;
    }

    save();render();document.getElementById("ovImport").classList.remove("open");
    if(filled>0){
      toast("Заполнено ячеек: "+filled+(splitFilled?" · подгруппы распознаны: "+splitFilled:""));
    }else{
      toast("Не удалось распознать. Попробуй вставить ещё раз или заполни вручную");
    }
  };
